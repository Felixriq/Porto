<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0D1015">
<title>Sertifikat | Muhammad Thoriq Salahudin Haryoto</title>
<meta name="description" content="Daftar sertifikasi kompetensi resmi Muhammad Thoriq Salahudin Haryoto di bidang Machine Learning, Data Science, IoT, dan Python.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<style>
  /* Peningkatan Tampilan Kartu Sertifikat */
  .cert-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 24px;
  }
  .cert-toolbar .filt {
    margin: 0;
  }
  .cert-search {
    flex: 0 1 280px;
    min-width: 220px;
  }
  .cert-search input {
    width: 100%;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    font: 400 13.5px var(--body);
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .cert-search input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(110, 155, 255, .15);
  }
  .cert-search input::placeholder {
    color: var(--muted);
  }

  .certs {
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 18px;
  }
  div.cert {
    --mx: 50%;
    --my: 50%;
    position: relative;
    cursor: pointer;
    padding: 0;
    overflow: hidden;
    border-radius: 12px;
    background: var(--panel);
    border: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    transition: border-color .22s, transform .22s, box-shadow .22s;
  }
  div.cert:hover {
    transform: translateY(-4px);
    border-color: rgba(110, 155, 255, .55);
    background: radial-gradient(circle 160px at var(--mx) var(--my), rgba(110, 155, 255, .16), transparent 75%), var(--panel2);
    box-shadow: 0 18px 36px -16px rgba(0, 0, 0, .85);
  }

  /* Kartu Unggulan Learning Path */
  div.cert.featured {
    grid-column: 1 / -1;
    display: grid;
    grid-template-columns: .85fr 1.15fr;
    background: linear-gradient(135deg, rgba(11, 31, 102, .42), var(--panel) 70%);
    border-color: rgba(110, 155, 255, .42);
  }
  div.cert.featured .th.pdf {
    height: 100%;
    min-height: 200px;
    border-bottom: 0;
    border-right: 1px solid var(--line);
  }
  div.cert.featured b {
    font-size: 1.35rem;
  }
  @media (max-width: 760px) {
    div.cert.featured {
      grid-template-columns: 1fr;
    }
    div.cert.featured .th.pdf {
      min-height: 150px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
  }

  .cert .th {
    margin: 0;
    border-radius: 0;
    position: relative;
  }
  .cert .th.pdf {
    aspect-ratio: 16 / 9;
    background:
      radial-gradient(circle at 85% 20%, rgba(47, 107, 255, .25), transparent 55%),
      repeating-linear-gradient(45deg, var(--panel2) 0 10px, #161B24 10px 20px);
  }
  .cert .th.pdf::after {
    content: attr(data-yr);
    position: absolute;
    right: 12px;
    bottom: -6px;
    font: 800 3.2rem/1 var(--head);
    color: rgba(255, 255, 255, .05);
    pointer-events: none;
  }
  .cert .th.pdf b {
    font: 700 12px var(--mono);
    letter-spacing: .16em;
    color: var(--accent);
    border: 1.5px solid var(--accent);
    background: rgba(13, 16, 21, .7);
    backdrop-filter: blur(4px);
    padding: 7px 14px;
    border-radius: 6px;
    transition: background .2s, color .2s, transform .2s;
    z-index: 1;
  }
  div.cert:hover .th.pdf b {
    background: var(--accent);
    color: #06142e;
    transform: scale(1.04);
  }

  .c-badge {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 2;
    font: 500 10.5px var(--mono);
    letter-spacing: .1em;
    text-transform: uppercase;
    color: var(--ink);
    background: rgba(13, 16, 21, .82);
    border: 1px solid var(--line);
    padding: 3px 9px;
    border-radius: 5px;
  }

  .c-body {
    padding: 16px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex: 1;
  }
  .c-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font: 500 11px var(--mono);
    letter-spacing: .06em;
    color: var(--accent);
    text-transform: uppercase;
  }
  .c-meta time {
    color: var(--muted);
  }
  .c-body b {
    font: 700 1.08rem/1.32 var(--head);
    color: var(--ink);
    margin: 2px 0 6px;
  }
  .c-foot {
    margin-top: auto;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .c-foot em {
    margin: 0;
    font: 500 11.5px var(--mono);
    color: var(--muted);
  }
  div.cert:hover .c-foot em {
    color: var(--ink);
  }
  .c-ver {
    font: 500 11.5px var(--mono);
    color: var(--accent);
    text-decoration: none;
    padding: 3px 8px;
    border-radius: 5px;
    border: 1px solid rgba(110, 155, 255, .35);
    background: rgba(47, 107, 255, .12);
    transition: background .2s, color .2s;
  }
  .c-ver:hover {
    background: var(--accent);
    color: #06142e;
  }

  /* Tombol di dalam Lightbox */
  .lb-acts {
    position: absolute;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
  }
  .lb-acts a {
    position: static;
    transform: none;
    text-decoration: none;
    padding: 8px 18px;
    font-size: 12.5px;
  }
</style>
</head>
<body data-page="sertifikat" data-title="Sertifikat">

<nav class="nav" id="nav"></nav>

<main>
  <section class="wrap pg" id="top">
    <div class="sh">
      <div>
        <span class="mono">Lembar 03 | Kredensial & Lisensi</span>
        <h2>Sertifikat</h2>
        <p class="sub">Kumpulan sertifikasi kursus Machine Learning, Data Science, AI, workshop, dan kepanitiaan yang telah diselesaikan.</p>
      </div>
      <div class="acts">
        <span class="mono" id="certCnt"></span>
      </div>
    </div>

    <div class="cert-toolbar">
      <div class="filt" id="filt" role="tablist" aria-label="Kategori sertifikat"></div>

        <input type="search" id="certSearch" placeholder="Cari sertifikat atau kode (ML0101EN)..." aria-label="Cari sertifikat">

    <div class="certs" id="certs"></div>
